name: Pages

# Publishes site/ (plus docs/art as art/) to https://mpalermiti.github.io/tally-for-teams/.
# Skips while the repository is private.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/art/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test site art
        run: npx vitest run test/art.test.ts test/site.test.ts
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/art _site/art
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
