name: Build

# Tests, builds and packs the plugin on a Mac on every push and pull request, keeping the
# package as a run artifact. Tags like v1.0.0 publish that artifact in a separate release job.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Versions agree
        run: npm run version:check -- "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
      - run: npm run typecheck
      - run: npm test
      - name: Pack
        run: |
          npm run pack
          mkdir -p dist
          mv ai.michaelp.tally.streamDeckPlugin dist/
      - name: Validate manifest
        run: npx streamdeck validate ai.michaelp.tally.sdPlugin
      - name: Helper runs on both architectures
        timeout-minutes: 1
        run: |
          lipo ai.michaelp.tally.sdPlugin/bin/teams-bridge -verify_arch arm64
          lipo ai.michaelp.tally.sdPlugin/bin/teams-bridge -verify_arch x86_64
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo | arch -x86_64 ai.michaelp.tally.sdPlugin/bin/teams-bridge
            echo "✓ Intel helper starts and exits"
          else
            echo "Rosetta unavailable; Intel launch not tested"
          fi
      - run: npm run smoke
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v7
        with:
          name: ai.michaelp.tally.streamDeckPlugin
          path: dist/ai.michaelp.tally.streamDeckPlugin
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ai.michaelp.tally.streamDeckPlugin
          path: dist
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/ai.michaelp.tally.streamDeckPlugin dist/Tally.streamDeckPlugin
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Tally.streamDeckPlugin --clobber
          else
            flags=(--generate-notes --title "Tally for Teams ${GITHUB_REF_NAME#v}")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/Tally.streamDeckPlugin "${flags[@]}"
          fi
